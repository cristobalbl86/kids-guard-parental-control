name: Test Suites (Parallel)

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  storage-tests:
    name: Storage Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:storage
        env:
          CI: true

  screen-tests:
    name: Screen Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:screens
        env:
          CI: true

  volume-tests:
    name: Volume Control Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:volumeControl
        env:
          CI: true

  all-tests-passed:
    name: All Tests Passed ✅
    runs-on: ubuntu-latest
    needs: [storage-tests, screen-tests, volume-tests]
    if: always()
    steps:
      - name: Check all test suites passed
        run: |
          if [[ "${{ needs.storage-tests.result }}" != "success" ]] || \
             [[ "${{ needs.screen-tests.result }}" != "success" ]] || \
             [[ "${{ needs.volume-tests.result }}" != "success" ]]; then
            echo "❌ One or more test suites failed!"
            echo "Storage: ${{ needs.storage-tests.result }}"
            echo "Screens: ${{ needs.screen-tests.result }}"
            echo "Volume: ${{ needs.volume-tests.result }}"
            exit 1
          fi
          echo "✅ All test suites passed!"
